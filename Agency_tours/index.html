<!DOCTYPE html>

        <title>Agency tours - sistema de reservas</title>
        <link rel="stylesheet"  href="style.css">
    </head>

        <div class = "container" >
            <h2 class="text">Agency Tours - sistema de reservas </h2>
            <h4 class ="sep-1">Datos de reserva</h4>
            <h5 class="text">Ciudad de destino:</h5>
            <select name="ciudades" class ="campo">
                <option>Ciudad A</option>
                <option>Ciudad B</option>

                <option>Ciudad D</option>
            </select>
            <h5 class="text" >Numero de personas:</h5>
            <input type="text" placeholder="Numero" class="campo">
            <h5 class="text">tipo de pago:</h5>
            <select class="campo">
                <option>Efectivo</option>
                <option>tarjeta</option>
            </select>
            <button >calcular reserva</button>
            <button>limpiar</button>
        </div>
    </body>
</html>
